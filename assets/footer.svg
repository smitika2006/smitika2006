<svg width="1200" height="190" viewBox="0 0 1200 190"
xmlns="http://www.w3.org/2000/svg">

  <defs><!-- Same theme as header -->
<linearGradient id="bg"
                x1="0%" y1="0%"
                x2="100%" y2="100%">
  <stop offset="0%" stop-color="#05070D"/>
  <stop offset="25%" stop-color="#0B1020"/>
  <stop offset="55%" stop-color="#123A49"/>
  <stop offset="80%" stop-color="#0B1020"/>
  <stop offset="100%" stop-color="#05070D"/>
</linearGradient>

<!-- Starry-sky glow -->
<radialGradient id="skyGlow"
                cx="50%" cy="45%"
                r="65%">
  <stop offset="0%" stop-color="#123A49" stop-opacity="0.45"/>
  <stop offset="55%" stop-color="#123A49" stop-opacity="0.12"/>
  <stop offset="100%" stop-color="#05070D" stop-opacity="0"/>
</radialGradient>

<!-- Star glow -->
<filter id="starGlow"
        x="-200%" y="-200%"
        width="400%" height="400%">
  <feGaussianBlur stdDeviation="2.2"
                  result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<!-- Wave glow -->
<filter id="waveGlow"
        x="-20%" y="-100%"
        width="140%" height="300%">
  <feGaussianBlur stdDeviation="2"
                  result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<clipPath id="clip">
  <rect width="1200" height="190"/>
</clipPath>

  </defs>  <!-- ================================================= -->  <!-- STAR SKY BACKGROUND -->  <!-- ================================================= --><rect width="1200"
height="190"
fill="url(#bg)"/>

<rect width="1200"
height="190"
fill="url(#skyGlow)"/>

  <!-- ================================================= -->  <!-- TOP FLOWING WAVE -->  <!-- ================================================= -->  <!-- Main dark flowing wave --><path d="
M0 0
L0 42
C120 72 235 82 350 58
C455 36 530 12 600 24
C670 12 745 36 850 58
C965 82 1080 72 1200 42
L1200 0
Z"
fill="#05070D"/>

  <!-- Cyan edge of wave --><path d="
M0 42
C120 72 235 82 350 58
C455 36 530 12 600 24
C670 12 745 36 850 58
C965 82 1080 72 1200 42"
fill="none"
stroke="#5DEBFF"
stroke-width="1.4"
stroke-opacity="0.38"
filter="url(#waveGlow)">

<animate attributeName="stroke-opacity"
         values="0.18;0.5;0.18"
         dur="4s"
         repeatCount="indefinite"/>

  </path>  <!-- Purple secondary wave --><path d="
M0 50
C125 80 240 88 355 65
C460 44 530 25 600 35
C670 25 740 44 845 65
C960 88 1075 80 1200 50"
fill="none"
stroke="#7C3AED"
stroke-width="1"
stroke-opacity="0.22">

<animate attributeName="stroke-opacity"
         values="0.08;0.32;0.08"
         dur="5s"
         repeatCount="indefinite"/>

  </path>  <!-- ================================================= -->  <!-- STAR FIELD BELOW THE WAVE -->  <!-- ================================================= --><g clip-path="url(#clip)"
fill="#5DEBFF"
filter="url(#starGlow)">

<!-- Row 1 -->
<circle cx="60" cy="82" r="0.8">
  <animate attributeName="opacity"
           values="0.1;0.9;0.15"
           dur="2.8s"
           repeatCount="indefinite"/>
</circle>

<circle cx="125" cy="115" r="1.1">
  <animate attributeName="opacity"
           values="0.8;0.15;0.8"
           dur="3.5s"
           repeatCount="indefinite"/>
</circle>

<circle cx="190" cy="92" r="0.7">
  <animate attributeName="opacity"
           values="0.15;1;0.15"
           dur="2.4s"
           repeatCount="indefinite"/>
</circle>

<circle cx="255" cy="135" r="0.9">
  <animate attributeName="opacity"
           values="0.7;0.1;0.9;0.2;0.7"
           dur="4s"
           repeatCount="indefinite"/>
</circle>

<circle cx="320" cy="100" r="0.8">
  <animate attributeName="opacity"
           values="0.1;0.8;0.1"
           dur="3.1s"
           repeatCount="indefinite"/>
</circle>

<circle cx="385" cy="150" r="1">
  <animate attributeName="opacity"
           values="0.8;0.15;0.8"
           dur="2.9s"
           repeatCount="indefinite"/>
</circle>


<!-- Center -->
<circle cx="450" cy="92" r="0.8">
  <animate attributeName="opacity"
           values="0.15;1;0.15"
           dur="3.3s"
           repeatCount="indefinite"/>
</circle>

<circle cx="515" cy="128" r="1">
  <animate attributeName="opacity"
           values="0.7;0.1;0.8"
           dur="3.7s"
           repeatCount="indefinite"/>
</circle>

<circle cx="680" cy="105" r="0.9">
  <animate attributeName="opacity"
           values="0.1;1;0.2"
           dur="2.7s"
           repeatCount="indefinite"/>
</circle>

<circle cx="745" cy="145" r="1">
  <animate attributeName="opacity"
           values="0.8;0.15;0.8"
           dur="3.6s"
           repeatCount="indefinite"/>
</circle>


<!-- Right -->
<circle cx="810" cy="90" r="0.8">
  <animate attributeName="opacity"
           values="0.15;0.9;0.15"
           dur="2.5s"
           repeatCount="indefinite"/>
</circle>

<circle cx="875" cy="130" r="1.1">
  <animate attributeName="opacity"
           values="0.8;0.1;0.9"
           dur="3.4s"
           repeatCount="indefinite"/>
</circle>

<circle cx="940" cy="98" r="0.7">
  <animate attributeName="opacity"
           values="0.1;1;0.15"
           dur="2.9s"
           repeatCount="indefinite"/>
</circle>

<circle cx="1005" cy="145" r="0.9">
  <animate attributeName="opacity"
           values="0.7;0.1;0.8"
           dur="4.1s"
           repeatCount="indefinite"/>
</circle>

<circle cx="1070" cy="105" r="1">
  <animate attributeName="opacity"
           values="0.15;1;0.15"
           dur="3.2s"
           repeatCount="indefinite"/>
</circle>

<circle cx="1140" cy="138" r="0.8">
  <animate attributeName="opacity"
           values="0.8;0.15;0.8"
           dur="2.6s"
           repeatCount="indefinite"/>
</circle>


<!-- Lower stars -->
<circle cx="90" cy="165" r="0.7">
  <animate attributeName="opacity"
           values="0.2;1;0.2"
           dur="3.8s"
           repeatCount="indefinite"/>
</circle>

<circle cx="210" cy="175" r="0.9">
  <animate attributeName="opacity"
           values="0.8;0.1;0.8"
           dur="2.7s"
           repeatCount="indefinite"/>
</circle>

<circle cx="330" cy="168" r="0.7">
  <animate attributeName="opacity"
           values="0.1;0.9;0.1"
           dur="3.5s"
           repeatCount="indefinite"/>
</circle>

<circle cx="870" cy="170" r="0.8">
  <animate attributeName="opacity"
           values="0.2;1;0.2"
           dur="3.3s"
           repeatCount="indefinite"/>
</circle>

<circle cx="990" cy="165" r="0.9">
  <animate attributeName="opacity"
           values="0.8;0.15;0.8"
           dur="3.9s"
           repeatCount="indefinite"/>
</circle>

<circle cx="1120" cy="175" r="0.7">
  <animate attributeName="opacity"
           values="0.1;1;0.1"
           dur="2.8s"
           repeatCount="indefinite"/>
</circle>

  </g>  <!-- ================================================= -->  <!-- DAZZLING SPARKLES -->  <!-- ================================================= --><g fill="#E8FCFF"
filter="url(#starGlow)">

<!-- Left sparkle -->
<g transform="translate(155 108)">
  <path d="
    M0 -6
    L1.2 -1.2
    L6 0
    L1.2 1.2
    L0 6
    L-1.2 1.2
    L-6 0
    L-1.2 -1.2 Z">

    <animate attributeName="opacity"
             values="0.05;1;0.1"
             dur="3.2s"
             repeatCount="indefinite"/>

    <animateTransform attributeName="transform"
                      type="rotate"
                      from="0"
                      to="360"
                      dur="9s"
                      repeatCount="indefinite"/>
  </path>
</g>


<!-- Right sparkle -->
<g transform="translate(1040 118)">
  <path d="
    M0 -6
    L1.2 -1.2
    L6 0
    L1.2 1.2
    L0 6
    L-1.2 1.2
    L-6 0
    L-1.2 -1.2 Z">

    <animate attributeName="opacity"
             values="0.1;1;0.1"
             dur="2.7s"
             repeatCount="indefinite"/>

    <animateTransform attributeName="transform"
                      type="rotate"
                      from="360"
                      to="0"
                      dur="8s"
                      repeatCount="indefinite"/>
  </path>
</g>


<!-- Small sparkles -->
<g transform="translate(300 150)">
  <path d="
    M0 -4
    L0.8 -0.8
    L4 0
    L0.8 0.8
    L0 4
    L-0.8 0.8
    L-4 0
    L-0.8 -0.8 Z">

    <animate attributeName="opacity"
             values="0.05;0.8;0.05"
             dur="2.4s"
             repeatCount="indefinite"/>
  </path>
</g>


<g transform="translate(905 155)">
  <path d="
    M0 -4
    L0.8 -0.8
    L4 0
    L0.8 0.8
    L0 4
    L-0.8 0.8
    L-4 0
    L-0.8 -0.8 Z">

    <animate attributeName="opacity"
             values="0.05;0.9;0.05"
             dur="3.1s"
             repeatCount="indefinite"/>
  </path>
</g>

  </g>  <!-- ================================================= -->  <!-- BOTTOM FADE / FLOW -->  <!-- ================================================= --><path d="
M0 178
C180 165 300 182 450 174
C540 169 560 160 600 163
C640 160 660 169 750 174
C900 182 1020 165 1200 178"
fill="none"
stroke="#5DEBFF"
stroke-width="1"
stroke-opacity="0.12"/>

  <!-- ================================================= -->  <!-- CORNER ACCENTS -->  <!-- ================================================= --><path d="M18 150 L18 178 L42 178"
fill="none"
stroke="#5DEBFF"
stroke-width="1.5"
stroke-opacity="0.4"/>

<path d="M1158 178 L1182 178 L1182 150"
fill="none"
stroke="#7C3AED"
stroke-width="1.5"
stroke-opacity="0.4"/>

</svg>
