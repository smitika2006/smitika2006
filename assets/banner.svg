  </g>  <!-- ================= DAZZLING STARS ================= -->  <g fill="#E8FCFF" filter="url(#glow)"><!-- Left sparkle -->
<g transform="translate(115 55)">
  <path d="M0,-7 L1.4,-1.4 L7,0 L1.4,1.4 L0,7 L-1.4,1.4 L-7,0 L-1.4,-1.4 Z">
    <animate attributeName="opacity"
             values="0.1;1;0.15"
             dur="3.4s"
             repeatCount="indefinite"/>
    <animateTransform attributeName="transform"
                      type="rotate"
                      from="0"
                      to="360"
                      dur="9s"
                      repeatCount="indefinite"/>
  </path>
</g>

<!-- Right sparkle -->
<g transform="translate(1080 62)">
  <path d="M0,-6 L1.2,-1.2 L6,0 L1.2,1.2 L0,6 L-1.2,1.2 L-6,0 L-1.2,-1.2 Z">
    <animate attributeName="opacity"
             values="0.15;1;0.15"
             dur="2.8s"
             repeatCount="indefinite"/>
    <animateTransform attributeName="transform"
                      type="rotate"
                      from="360"
                      to="0"
                      dur="8s"
                      repeatCount="indefinite"/>
  </path>
</g>

<!-- Small sparkle -->
<g transform="translate(250 145)">
  <path d="M0,-4 L0.8,-0.8 L4,0 L0.8,0.8 L0,4 L-0.8,0.8 L-4,0 L-0.8,-0.8 Z">
