fill="#5DEBFF"
filter="url(#glow)">
TURNING IDEAS INTO CODE

<animate attributeName="opacity"
         values="0.88;1;0.88"
         dur="3s"
         repeatCount="indefinite"/>

  </text>  <!-- ================= TITLE GLOW LINE ================= --><line x1="410"
y1="153"
x2="790"
y2="153"
