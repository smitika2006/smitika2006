<svg width="1200" height="250" viewBox="0 0 1200 250"
xmlns="http://www.w3.org/2000/svg">

  <defs><!-- Same dark futuristic color theme -->
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#05070D"/>
  <stop offset="25%" stop-color="#0B1020"/>
  <stop offset="55%" stop-color="#123A49"/>
  <stop offset="80%" stop-color="#0B1020"/>
  <stop offset="100%" stop-color="#05070D"/>
</linearGradient>

<!-- Cyan glow -->
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="2.5" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<!-- Soft background glow -->
<radialGradient id="skyGlow">
  <stop offset="0%" stop-color="#123A49" stop-opacity="0.55"/>
  <stop offset="60%" stop-color="#0B1020" stop-opacity="0.15"/>
  <stop offset="100%" stop-color="#05070D" stop-opacity="0"/>
</radialGradient>

<!-- Clip to banner -->
<clipPath id="bannerClip">
  <rect width="1200" height="250" rx="0"/>
</clipPath>

  </defs>  <!-- ================= BACKGROUND ================= -->  <rect width="1200" height="250" fill="url(#bg)"/><ellipse cx="600" cy="70"
rx="520"
ry="170"
fill="url(#skyGlow)"/>

  <!-- ================= STARRY SKY ================= -->  <g clip-path="url(#bannerClip)" fill="#5DEBFF" filter="url(#glow)"><!-- Tiny stars -->
<circle cx="42" cy="42" r="1">
