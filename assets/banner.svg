    <animate attributeName="opacity"
             values="0.05;0.9;0.05"
             dur="3.1s"
             repeatCount="indefinite"/>
  </path>
</g>

  </g>  <!-- ================= WAVING BOTTOM SHAPE ================= --><path d="M0 185
C150 225 280 225 420 190
C560 155 650 155 790 190
C930 225 1050 225 1200 185
L1200 250
L0 250 Z"
fill="#05070D"
fill-opacity="0.92"/>

<path d="M0 185
C150 225 280 225 420 190
C560 155 650 155 790 190
C930 225 1050 225 1200 185"
