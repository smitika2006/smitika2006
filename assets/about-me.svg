<svg
width="1200"
height="520"
viewBox="0 0 1200 520"
xmlns="http://www.w3.org/2000/svg">

  <defs><!-- ================= BACKGROUND ================= -->

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#05070D"/>
  <stop offset="50%" stop-color="#0B1020"/>
  <stop offset="100%" stop-color="#03050A"/>
</linearGradient>

<linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#111827"/>
  <stop offset="50%" stop-color="#0D1524"/>
  <stop offset="100%" stop-color="#080D17"/>
</linearGradient>

<linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
  <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.02"/>
  <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>

<linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#5DEBFF"/>
  <stop offset="100%" stop-color="#2389A5"/>
</linearGradient>

<linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#B66CFF"/>
  <stop offset="100%" stop-color="#5B32A3"/>
</linearGradient>

<!-- ================= GLOWS ================= -->

<radialGradient id="glow1">
  <stop offset="0%" stop-color="#087F9B" stop-opacity="0.25"/>
  <stop offset="100%" stop-color="#087F9B" stop-opacity="0"/>
</radialGradient>

<radialGradient id="glow2">
  <stop offset="0%" stop-color="#7A35C5" stop-opacity="0.16"/>
  <stop offset="100%" stop-color="#7A35C5" stop-opacity="0"/>
</radialGradient>

<filter id="shadow"
  x="-30%"
  y="-30%"
  width="160%"
  height="170%">

  <feGaussianBlur stdDeviation="14"/>

</filter>

<filter id="cyanGlow"
  x="-100%"
  y="-100%"
  width="300%"
  height="300%">

  <feGaussianBlur
    stdDeviation="6"
    result="blur"/>

  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>

</filter>

<filter id="purpleGlow"
  x="-100%"
  y="-100%"
  width="300%"
  height="300%">

  <feGaussianBlur
    stdDeviation="5"
    result="blur"/>

  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>

</filter>

<!-- ================= GRID ================= -->

<pattern
  id="grid"
  width="45"
  height="45"
  patternUnits="userSpaceOnUse">

  <path
    d="M45 0H0V45"
    fill="none"
    stroke="#1B6B82"
    stroke-width="0.7"
    opacity="0.22"/>

</pattern>

  </defs>  <!-- ========================================================= -->  <!-- BACKGROUND -->  <!-- ========================================================= --><rect
width="1200"
height="520"
rx="32"
fill="url(#bg)"/>

  <!-- Cyan ambient light --><ellipse
cx="170"
cy="120"
rx="300"
ry="220"
fill="url(#glow1)">

<animate
  attributeName="opacity"
  values="0.55;0.9;0.55"
  dur="5s"
  repeatCount="indefinite"/>

<animate
  attributeName="rx"
  values="300;340;300"
  dur="6s"
  repeatCount="indefinite"/>

  </ellipse>  <!-- Purple ambient light --><ellipse
