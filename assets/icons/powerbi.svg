<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF176"/>
      <stop offset="0.45" stop-color="#F2C811"/>
      <stop offset="1" stop-color="#C49A00"/>
    </linearGradient>

    <linearGradient id="darkGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDB700"/>
      <stop offset="1" stop-color="#8A6900"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="5" stdDeviation="3" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- back/depth -->
    <path d="M20 42 L30 48 L30 78 L20 72 Z" fill="url(#darkGold)"/>
    <path d="M43 27 L53 33 L53 78 L43 72 Z" fill="url(#darkGold)"/>
    <path d="M66 12 L76 18 L76 78 L66 72 Z" fill="url(#darkGold)"/>

    <!-- bars -->
    <rect x="14" y="36" width="16" height="42" rx="3" fill="url(#gold)"/>
    <rect x="37" y="21" width="16" height="57" rx="3" fill="url(#gold)"/>
    <rect x="60" y="6" width="16" height="72" rx="3" fill="url(#gold)"/>

    <!-- highlight -->
    <path d="M17 39 H20 V73 H17 Z" fill="#FFF9C4" opacity=".65"/>
    <path d="M40 24 H43 V73 H40 Z" fill="#FFF9C4" opacity=".65"/>
    <path d="M63 9 H66 V73 H63 Z" fill="#FFF9C4" opacity=".65"/>
  </g>
</svg>
